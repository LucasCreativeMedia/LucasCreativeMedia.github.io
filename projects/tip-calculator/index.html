<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tip Calculator</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f1ea;
    display: flex;
    justify-content: center;
    padding-top: 60px;
  }
  .card {
    background: white;
    border-radius: 12px;
    padding: 24px 32px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    width: 320px;
  }
  h1 {
    font-size: 20px;
    margin-bottom: 20px;
  }
  label {
    display: block;
    font-size: 14px;
    color: #555;
    margin-top: 16px;
    margin-bottom: 4px;
  }
  input, select {
    width: 100%;
    padding: 8px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
  }
  .result {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid #eee;
  }
  .result p {
    display: flex;
    justify-content: space-between;
    font-size: 16px;
    margin: 6px 0;
  }
  .result span:last-child {
    font-weight: bold;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Tip Calculator</h1>

  <label for="bill">Bill amount ($)</label>
  <input type="number" id="bill" placeholder="0.00" step="0.01">

  <label for="tipPercent">Tip percentage</label>
  <select id="tipPercent">
    <option value="10">10%</option>
    <option value="15" selected>15%</option>
    <option value="18">18%</option>
    <option value="20">20%</option>
    <option value="25">25%</option>
  </select>

  <label for="people">Split between how many people?</label>
  <input type="number" id="people" value="1" min="1">

  <div class="result">
    <p><span>Tip amount:</span> <span id="tipAmount">$0.00</span></p>
    <p><span>Total bill:</span> <span id="totalAmount">$0.00</span></p>
    <p><span>Per person:</span> <span id="perPerson">$0.00</span></p>
  </div>
</div>

<script>
  const billInput = document.getElementById('bill');
  const tipSelect = document.getElementById('tipPercent');
  const peopleInput = document.getElementById('people');

  const tipAmountEl = document.getElementById('tipAmount');
  const totalAmountEl = document.getElementById('totalAmount');
  const perPersonEl = document.getElementById('perPerson');

  function calculate() {
    const bill = parseFloat(billInput.value) || 0;
    const tipPercent = parseFloat(tipSelect.value);
    const people = parseInt(peopleInput.value) || 1;

    const tipAmount = bill * (tipPercent / 100);
    const total = bill + tipAmount;
    const perPerson = total / people;

    tipAmountEl.textContent = '$' + tipAmount.toFixed(2);
    totalAmountEl.textContent = '$' + total.toFixed(2);
    perPersonEl.textContent = '$' + perPerson.toFixed(2);
  }

  billInput.addEventListener('input', calculate);
  tipSelect.addEventListener('change', calculate);
  peopleInput.addEventListener('input', calculate);
</script>

</body>
</html>
